<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Arial, Helvetica, sans-serif">
<title id="ttl">Порочный круг вины (Рис. 8.1)</title>
<desc id="desc">Три блока — Мысли, Эмоции, Поведение — связаны двусторонними стрелками и взаимно усиливают друг друга.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#555555"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="470" fill="#ffffff"/>

<rect x="185" y="24" width="310" height="150" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="205" y="56" font-size="17" font-weight="700" fill="#111111">Мысли</text>
<text x="205" y="88" font-size="14" fill="#333333">Я не должна смотреть телевизор.</text>
<text x="205" y="114" font-size="14" fill="#333333">Я ленива и ни на что не гожусь.</text>
<text x="205" y="140" font-size="14" fill="#333333">Я слабовольная свинья.</text>

<rect x="40" y="312" width="250" height="140" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="60" y="344" font-size="17" font-weight="700" fill="#111111">Эмоции</text>
<text x="60" y="376" font-size="14" fill="#333333">Вина</text>
<text x="60" y="402" font-size="14" fill="#333333">Тревога</text>
<text x="60" y="428" font-size="14" fill="#333333">Ненависть к себе</text>

<rect x="390" y="312" width="250" height="140" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="410" y="344" font-size="17" font-weight="700" fill="#111111">Поведение</text>
<text x="410" y="376" font-size="14" fill="#333333">Прокрастинация</text>
<text x="410" y="402" font-size="14" fill="#333333">Импульсивное</text>
<text x="410" y="424" font-size="14" fill="#333333">переедание</text>

<line x1="238" y1="176" x2="150" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="180" y1="310" x2="268" y2="176" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

<line x1="442" y1="176" x2="530" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="500" y1="310" x2="412" y2="176" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
