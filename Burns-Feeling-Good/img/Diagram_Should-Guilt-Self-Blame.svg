<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Arial, Helvetica, sans-serif">
<title id="ttl">Искажения, вина и самобичевание — три уровня</title>
<desc id="desc">Вину запускает не только «должен», но и персонализация, преувеличение, навешивание ярлыка; через вывод «я плохой» искажение рождает вину, а та выливается в самобичевание, замыкая порочный круг.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

<text x="110" y="60" font-size="13" text-anchor="middle" fill="#666666">Мысль</text>
<text x="342" y="60" font-size="13" text-anchor="middle" fill="#666666">Эмоция</text>
<text x="576" y="60" font-size="13" text-anchor="middle" fill="#666666">Действие</text>

<rect x="15" y="72" width="190" height="150" rx="10" fill="#eaf1fb" stroke="#3b6fb0" stroke-width="2"/>
<text x="110" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">Искажения</text>
<text x="110" y="126" font-size="13" text-anchor="middle" fill="#333333">«должен» — чаще всего</text>
<text x="110" y="148" font-size="13" text-anchor="middle" fill="#333333">персонализация</text>
<text x="110" y="170" font-size="13" text-anchor="middle" fill="#333333">преувеличение</text>
<text x="110" y="192" font-size="13" text-anchor="middle" fill="#333333">навешивание ярлыка</text>

<rect x="262" y="72" width="160" height="150" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
<text x="342" y="126" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вина</text>
<text x="342" y="154" font-size="13" text-anchor="middle" fill="#333333">приговор себе:</text>
<text x="342" y="174" font-size="13" text-anchor="middle" fill="#333333">«я плохой»</text>

<rect x="494" y="72" width="165" height="150" rx="10" fill="#fdf3e3" stroke="#cc8a2b" stroke-width="2"/>
<text x="576" y="126" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">Самобичевание</text>
<text x="576" y="154" font-size="13" text-anchor="middle" fill="#333333">грызу и наказываю</text>
<text x="576" y="174" font-size="13" text-anchor="middle" fill="#333333">себя</text>

<text x="233" y="140" font-size="13" text-anchor="middle" fill="#666666">вывод</text>
<line x1="205" y1="150" x2="262" y2="150" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="422" y1="150" x2="494" y2="150" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>

<path d="M576 222 C 576 312, 110 312, 110 222" fill="none" stroke="#555555" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="343" y="312" font-size="14" font-weight="500" text-anchor="middle" fill="#555555">порочный круг: подкрепляет «я плохой»</text>
</svg>
