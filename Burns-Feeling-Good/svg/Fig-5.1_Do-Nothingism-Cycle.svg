<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" role="img" aria-labelledby="ttl desc" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Круг оцепенения (рис. 5.1)</title>
<desc id="desc">Мысли, эмоции и действия связаны двусторонними стрелками и подкрепляют друг друга; вместе они приводят к последствиям, которые затягивают узел и возвращаются в мысли.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#555555"/>
</marker>
<marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#3A7BD5"/>
</marker>
</defs>
<rect x="0" y="0" width="860" height="680" fill="#ffffff"/>

<text x="470" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">Круг оцепенения (рис. 5.1)</text>

<g transform="translate(40,50)">

<!-- связи -->
<line x1="368.5" y1="177.9" x2="281.5" y2="267" stroke="#555555" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="312" y="207" text-anchor="end" font-size="14" font-style="italic" fill="#444444">«доказывают» друг друга</text>

<line x1="491.5" y1="177.9" x2="578.5" y2="267" stroke="#555555" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="548" y="207" text-anchor="start" font-size="14" font-style="italic" fill="#444444">оправдывают друг друга</text>

<line x1="310" y1="330" x2="550" y2="330" stroke="#555555" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="430" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#444444">усиливают друг друга</text>

<line x1="284.5" y1="389.8" x2="362" y2="461.8" stroke="#555555" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="575.5" y1="389.8" x2="498" y2="461.8" stroke="#555555" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="430" y="424" text-anchor="middle" font-size="14" font-style="italic" fill="#444444">приводят к</text>

<path d="M342 530 C0 580, 0 65, 338 108" fill="none" stroke="#3A7BD5" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
<text x="62" y="320" text-anchor="middle" font-size="14" font-style="italic" fill="#3A7BD5" transform="rotate(-90 62 320)">затягивают узел</text>

<!-- Мысли -->
<circle cx="430" cy="115" r="88" fill="#E6DDFB" stroke="#7B5CD6" stroke-width="3"/>
<text x="430" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#4B2FA8">Мысли</text>
<text x="430" y="126" text-anchor="middle" font-size="14" fill="#333333">«Нет смысла</text>
<text x="430" y="146" text-anchor="middle" font-size="14" fill="#333333">что-то делать»</text>

<!-- Эмоции -->
<circle cx="220" cy="330" r="88" fill="#FAD4CF" stroke="#D9534F" stroke-width="3"/>
<text x="220" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#A8322E">Эмоции</text>
<text x="220" y="341" text-anchor="middle" font-size="14" fill="#333333">апатия, вина,</text>
<text x="220" y="361" text-anchor="middle" font-size="14" fill="#333333">ненависть к себе</text>

<!-- Действия -->
<circle cx="640" cy="330" r="88" fill="#FFE3B8" stroke="#E8912D" stroke-width="3"/>
<text x="640" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#A85F0E">Действия</text>
<text x="640" y="341" text-anchor="middle" font-size="14" fill="#333333">лежу в кровати,</text>
<text x="640" y="361" text-anchor="middle" font-size="14" fill="#333333">избегаю людей и дел</text>

<!-- Последствия -->
<circle cx="430" cy="525" r="88" fill="#CFE3FA" stroke="#3A7BD5" stroke-width="3"/>
<text x="430" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#1F5AA8">Последствия</text>
<text x="430" y="536" text-anchor="middle" font-size="14" fill="#333333">друзья отдалились,</text>
<text x="430" y="556" text-anchor="middle" font-size="14" fill="#333333">дела стоят</text>

</g>
</svg>
